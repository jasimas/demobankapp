<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jasima Bank - Login</title>

    <link rel="stylesheet"
          href="./css/styles.css">

</head>

<body>

    <!-- HEADER -->

    <header class="login-header">

        <div class="logo">

            <span class="logo-name">
                jasima
            </span>

            <span class="logo-symbol">
                ◆
            </span>

            <span class="bank-name">
                Jasima Bank
            </span>

        </div>

    </header>


    <!-- LOGIN SECTION -->

    <main class="login-container">

        <div class="login-card">

            <h1>
                Welcome back
            </h1>

            <h2>
                Sign in to Jasima Bank
            </h2>

            <div class="underline"></div>


            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="button"
                id="loginButton"
                class="btn primary">

                Login

            </button>


            <!-- LOGIN MESSAGE -->

            <p id="loginMessage"></p>

        </div>


        <div class="login-image">

            🏦

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div>
            © Jasima Bank 2026. All rights reserved.
        </div>

        <div class="footer-links">

            <span>Security</span>

            <span>|</span>

            <span>Privacy policy</span>

            <span>|</span>

            <span>Service Terms</span>

        </div>

    </footer>


    <!-- LOGIN JAVASCRIPT -->

    <script src="./js/login.js"></script>

</body>

</html>
